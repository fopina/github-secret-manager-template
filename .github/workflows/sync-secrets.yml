name: Sync repository secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Validate mapping
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.mapping.outputs.matrix }}
    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3

      - name: Validate mapping and build target matrix
        id: mapping
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python .github/scripts/build_matrix.py >> "$GITHUB_OUTPUT"

  sync:
    name: ${{ matrix.source }} → ${{ matrix.repository }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Set target repository secret
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_SECRETS_TOKEN }}
          SOURCE_SECRET: ${{ secrets[matrix.source] }}
          SOURCE_NAME: ${{ matrix.source }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "REPOSITORY_SECRETS_TOKEN is missing or empty." >&2
            exit 1
          fi
          if [[ -z "$SOURCE_SECRET" ]]; then
            echo "Source Actions secret '$SOURCE_NAME' is missing or empty." >&2
            exit 1
          fi

          printf '%s' "$SOURCE_SECRET" | gh secret set "$TARGET_NAME" --repo "$TARGET_REPOSITORY"
          echo "Synced $SOURCE_NAME to $TARGET_REPOSITORY as $TARGET_NAME."
